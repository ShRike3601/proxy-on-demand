# Push a tag like v1.0.0 to build ProxyOnDemand.exe and publish it as a GitHub Release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write  # needed to create the release
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-build.txt
      - name: Tag matches the app version
        shell: bash
        run: |
          v=$(python proxy_app.py --version)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match __version__ $v"; exit 1; }
      - run: python test_proxy_app.py
      - name: Build
        run: pyinstaller --noconfirm --clean --onefile --windowed --uac-admin --name ProxyOnDemand proxy_app.py
      - name: Self-check the built exe (bundled libraries, Tk, DPAPI)
        shell: pwsh
        run: |
          $p = Start-Process dist\ProxyOnDemand.exe -ArgumentList "--check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-check failed with exit code $($p.ExitCode)" }
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\ProxyOnDemand.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ProxyOnDemand.exe" | Out-File -Encoding ascii dist\ProxyOnDemand.exe.sha256
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/ProxyOnDemand.exe dist/ProxyOnDemand.exe.sha256 \
            --title "Proxy on demand $GITHUB_REF_NAME" --notes "$notes"
