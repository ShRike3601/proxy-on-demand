# Push a tag like v1.0.0 to build ProxyOnDemand.exe and publish it as a GitHub Release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write  # needed to create the release
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-build.txt
      - name: Tag matches the app version
        shell: bash
        run: |
          v=$(python proxy_app.py --version)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match __version__ $v"; exit 1; }
      - run: python test_proxy_app.py
      - name: Build
        run: |
          python scripts/make_version_file.py
          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin --name ProxyOnDemand --version-file version_info.txt --add-data "ui;ui" --add-data "prices.json;." --collect-all webview proxy_app.py
      - name: Self-check the built exe (bundled libraries, Tk, DPAPI)
        shell: pwsh
        run: |
          $p = Start-Process dist\ProxyOnDemand.exe -ArgumentList "--check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-check failed with exit code $($p.ExitCode)" }
      - name: Source zip (for in-app updates of copies run from source)
        run: git archive --format=zip -o dist/proxy-on-demand-source.zip HEAD
      - name: Checksums
        shell: pwsh
        run: |
          foreach ($f in "ProxyOnDemand.exe", "proxy-on-demand-source.zip") {
            $h = (Get-FileHash "dist\$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f" | Out-File -Encoding ascii "dist\$f.sha256"
          }
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/ProxyOnDemand.exe dist/ProxyOnDemand.exe.sha256 \
            dist/proxy-on-demand-source.zip dist/proxy-on-demand-source.zip.sha256 \
            --title "Proxy on demand $GITHUB_REF_NAME" --notes "$notes"
